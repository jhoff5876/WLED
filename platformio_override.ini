[platformio]
default_envs = seengreat_hub75_s3

[env:seengreat_hub75_s3]
extends = env:esp32s3dev_16MB_opi
build_flags = ${env:esp32s3dev_16MB_opi.build_flags}
  -D WLED_ENABLE_HUB75MATRIX
  -D SEENGREAT_MATRIX_S3_PINOUT
  -D NO_GFX
  -D NO_CIE1931
  -D SR_DMTYPE=254
  -D I2S_SDPIN=-1
  -D I2S_CKPIN=-1
  -D I2S_WSPIN=-1
  -D MCLK_PIN=-1
lib_deps =
  ${env:esp32s3dev_16MB_opi.lib_deps}
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git
  adafruit/Adafruit GFX Library
